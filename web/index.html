<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="telehealth_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>telehealth_app</title>
  <link rel="manifest" href="manifest.json">
  <!-- Agora Web (iris): canvas/video live inside a registered div; Fit render mode + CSS letterboxing -->
  <style>
    flt-scene-host div[id^="agora_rtc_engine"] video,
    flt-scene-host div[id^="agora_rtc_engine"] canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain !important;
      object-position: center center;
      background: #000;
    }
    flt-scene-host video {
      object-fit: contain !important;
      object-position: center center;
    }
  </style>
</head>
<body>
  <!-- Required for agora_rtc_engine on web (iris_web → Agora Web SDK 4.x). Without this, engine init throws e.g. createIrisApiEngine undefined. See package README “Web (alpha)”. -->
  <script src="https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
